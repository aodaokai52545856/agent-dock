[package]
name = "agent-dock"
version = "0.1.28"
description = "Launch and resume local AI CLI agents"
authors = ["aitools"]
edition = "2021"

[lib]
name = "agent_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omp-rpc = { path = "vendor/omp-rpc" }
aes-gcm = "0.10"
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
getrandom = "0.2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tauri = { version = "2", features = ["macos-private-api", "image-png", "unstable"] }
window-vibrancy = "0.6"
tauri-plugin-dialog = "2"
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart", "cookies", "gzip", "brotli", "deflate", "socks", "http2"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "time", "net"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rumqttc = "0.25"
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-reflection = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
tokio-stream = { version = "0.1", features = ["net"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
cookie_store = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "CALayer",
    "CAMediaTiming",
    "objc2-core-foundation",
] }
