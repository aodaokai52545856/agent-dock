name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: pack:win
          - os: macos-latest
            pack: pack:mac
          - os: ubuntu-22.04
            pack: pack:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run ${{ matrix.pack }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-dock-${{ matrix.os }}
          path: release/**
